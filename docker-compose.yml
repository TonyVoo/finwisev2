# A local trial of the production image: Postgres, the migrations, and the API, so you can see the real
# container work before paying for hosting. NOT a production deployment (see docs/DEPLOY.md).
#
#   JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))") \
#     docker compose -p expense-trial up --build
#
# The Investing tab and the assistant need the market service (the vn-stock-assistant repository). Beside this
# repository it is found by default; elsewhere, set MARKET_SERVICE_DIR. Give it a model with ANTHROPIC_API_KEY, or
# LLM_PROVIDER=mock to see the screens with canned answers. Without a model the quotes work and the brief and the
# assistant say they are unavailable.
#
# The API is then on http://localhost:3100/v1/health. Tear down with `docker compose -p expense-trial down -v`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: trial-only-password
      POSTGRES_DB: expense_tracker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense -d expense_tracker']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['pnpm', 'migrate:deploy']
    environment:
      DATABASE_URL: postgresql://expense:trial-only-password@db:5432/expense_tracker?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  market:
    build:
      context: ${MARKET_SERVICE_DIR:-../vn-stock-assistant/vn-stock-assistant}
    init: true
    environment:
      MARKET_API_KEY: ${MARKET_API_KEY:?set MARKET_API_KEY to a long random string}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      # Gemini: LLM_PROVIDER=openai_compat, base https://generativelanguage.googleapis.com/v1beta/openai
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    ports:
      - '3100:3000'
    environment:
      DATABASE_URL: postgresql://expense:trial-only-password@db:5432/expense_tracker?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random string}
      TRUST_PROXY: 'false'
      MARKET_API_URL: http://market:8001
      MARKET_API_KEY: ${MARKET_API_KEY:?set MARKET_API_KEY to a long random string}
    depends_on:
      migrate:
        condition: service_completed_successfully
      market:
        condition: service_started

volumes:
  db-data:
