  /v1/sync:
    get:
      operationId: pullSync
      tags: [sync]
      summary: Pull changes since a revision watermark
      description: |
        Returns every row of the user that changed after the `since` watermark, ordered by
        `revision` ascending, including tombstones.

        ## `since` is a revision, not a timestamp

        `revision` is a **per-user monotonic sequence number assigned by the server on
        every write**. `since` is a watermark in that sequence: the server returns rows
        with `revision > since`. It is not a time and must never be compared to one.

        This matters, and is the single most important thing to get right on the client. A
        timestamp cursor loses writes two ways: two rows written in the same millisecond
        (the second is skipped once the cursor passes that instant), and a cursor advanced
        past a row whose transaction had not yet committed when the page was built. Either
        way a record is silently never delivered and the client is permanently missing
        data with no error to show for it. A monotonic revision has neither failure mode.

        Start at `since=0` (or omit it) for a full download.

        ## Paging

        Keep calling with `since = nextCursor` while `hasMore` is true. Each page is a
        prefix of the remaining changes, so the sequence terminates.

        **Persist `nextCursor` only after the whole page is committed locally.** If you
        store the watermark first and then crash while writing the rows, those rows are
        never sent again.

        `nextCursor` is the highest `revision` in `changes`, or the `since` you sent when
        `changes` is empty — so an up-to-date client can safely store it unconditionally.

        ## Tombstones and the 90-day horizon

        Deleted rows arrive with `deletedAt` set; that tombstone is the only way a delete
        crosses the wire. Tombstones are pruned 90 days after deletion.

        If `since` predates the oldest surviving tombstone, an incremental answer would
        resurrect rows that were deleted and then pruned. The server therefore answers
        `resyncRequired: true` with `changes: []`, `nextCursor: 0` and `hasMore: false`.
        The client must wipe local server-derived state and pull again from `since=0`.
        A client that has pushed local changes it has not yet had acknowledged should push
        them before wiping, or it loses them.

        `resyncRequired` is also returned when `since` is greater than the user's current
        `serverRevision`, which means the client is holding a watermark from a database
        that no longer exists (a restore from backup, or a reset environment).
      parameters:
        - name: since
          in: query
          required: false
          description: |
            Revision watermark: return rows with `revision > since`. A server-assigned,
            per-user revision number — **not** a timestamp. Omit or pass `0` for a full
            download.
          schema: { $ref: '#/components/schemas/Revision' }
          example: 42
        - name: limit
          in: query
          required: false
          description: Maximum number of changes in the page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      x-errorCodes:
        - validation_error
        - unauthorized
        - token_expired
        - token_invalid
        - rate_limited
        - internal_error
      responses:
        '200':
          description: |
            A page of changes, or a resync instruction. Check `resyncRequired` first: when
            it is true the other fields carry no changes to apply.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }
              examples:
                incremental:
                  summary: Incremental page with more to come
                  value:
                    changes:
                      - entity: category
                        record:
                          id: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                          name: Coffee
                          color: '#f59e0b'
                          isDefault: false
                          createdAt: '2026-10-06T13:00:00.000Z'
                          updatedAt: '2026-10-06T13:00:00.000Z'
                          deletedAt: null
                          revision: 43
                      - entity: expense
                        record:
                          id: 0192f3b1-0000-7f1e-9b2d-000000000001
                          categoryId: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                          amountMinor: 450
                          currency: USD
                          date: '2026-10-06'
                          note: null
                          createdAt: '2026-10-06T13:05:00.000Z'
                          updatedAt: '2026-10-06T13:05:00.000Z'
                          deletedAt: null
                          revision: 44
                    nextCursor: 44
                    hasMore: true
                    resyncRequired: false
                    serverTime: '2026-10-06T13:06:00.000Z'
                upToDate:
                  summary: Nothing changed — `nextCursor` echoes the `since` you sent
                  value:
                    changes: []
                    nextCursor: 42
                    hasMore: false
                    resyncRequired: false
                    serverTime: '2026-10-06T13:06:00.000Z'
                tombstone:
                  summary: A delete, carried as a tombstone
                  value:
                    changes:
                      - entity: expense
                        record:
                          id: 0192f3b1-0000-7f1e-9b2d-000000000001
                          categoryId: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                          amountMinor: 450
                          currency: USD
                          date: '2026-10-06'
                          note: null
                          createdAt: '2026-10-06T13:05:00.000Z'
                          updatedAt: '2026-10-06T15:00:00.000Z'
                          deletedAt: '2026-10-06T15:00:00.000Z'
                          revision: 45
                    nextCursor: 45
                    hasMore: false
                    resyncRequired: false
                    serverTime: '2026-10-06T15:00:01.000Z'
                resyncRequired:
                  summary: '`since` predates the 90-day tombstone horizon'
                  value:
                    changes: []
                    nextCursor: 0
                    hasMore: false
                    resyncRequired: true
                    serverTime: '2026-10-06T13:06:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: pushSync
      tags: [sync]
      summary: Push a batch of local changes
      description: |
        Uploads a batch of locally-changed rows and returns **one result per record**.

        This is the mobile app's only write path, so it has one code path rather than two.

        ## Per-record results

        The response carries a result for every request item, in the order sent, each with
        a `status`:

        - `applied` — the incoming `updatedAt` was strictly newer than the stored one, so
          the write landed.
        - `conflict_server_wins` — the stored `updatedAt` was newer than or equal to the
          incoming one, so the write was dropped. Ties go to the server, which keeps the
          outcome deterministic.
        - `invalid` — validation or referential failure (an unknown `categoryId`, an
          incomplete create, a reused `clientMutationId`). `error` explains which.

        One bad row cannot fail the batch. The batch is applied in a single transaction,
        but an `invalid` item is skipped rather than rolling the rest back — otherwise a
        single permanently-unacceptable row would wedge the client's outbox forever.

        **Every result carries the authoritative server row in `record`, including on
        conflict.** The client overwrites its local copy with it. Converging on server
        state is what stops two devices drifting apart; a conflict response that only said
        "no" would leave the loser holding data the server will never have.

        `record` is null only when there is no server row to report: an `invalid` item for
        a row that does not exist server-side.

        ## Upsert with merge

        Creates and updates are the same call: the server upserts on `id`. `fields` is a
        partial — absent keys are left alone on an existing row. For a row the server has
        never seen, `fields` must be complete enough to create it (`name` for a category;
        `categoryId`, `amountMinor` and `date` for an expense) or the result is `invalid`.

        Delete by setting `fields.deletedAt`; undelete by setting it back to `null`.

        ## Last-write-wins, with the clock clamped

        Ordering is on the client's `updatedAt`, because the client is the only party that
        knows when the user actually made the edit. The server **clamps it to
        `now + 5 minutes`** before comparing and storing. A device with a badly-set clock
        would otherwise write a far-future `updatedAt` and permanently win every later
        conflict on that row — the row would become unfixable from any other device.
        A clamped item can therefore come back `conflict_server_wins` even though its raw
        `updatedAt` looked newer; the `record` in the response is the truth.

        ## Idempotency

        `clientMutationId` is a UUID, minted once per local mutation and **reused across
        retries**, unique per user. A push retried after a dropped response is a no-op that
        replays the original result with `idempotentReplay: true`. Without this a
        flaky-network retry double-applies, which is the most common offline-sync bug.

        Reusing a `clientMutationId` with a different payload is `invalid` with code
        `mutation_id_reused` — it means the client lost track of its outbox, and silently
        accepting it would hide the bug.

        ## Ordering within a batch

        The server applies all `category` items before all `expense` items, so an expense
        created offline against a category created offline in the same session syncs in a
        single round trip. Clients should push in that order too; the server sorts
        internally either way, so the two cannot disagree.

        ## Batch size

        1–500 items. Over 500 is `413 batch_too_large`; split and send sequentially,
        keeping categories ahead of the expenses that reference them.
      x-errorCodes:
        - validation_error
        - malformed_request
        - unsupported_media_type
        - unauthorized
        - token_expired
        - token_invalid
        - batch_too_large
        - rate_limited
        - internal_error
      # Codes that appear inside a per-record `result.error` on an otherwise-200
      # response, rather than as the HTTP status. A client has to handle these on the
      # individual record; the batch itself succeeded.
      x-recordErrorCodes:
        - validation_error
        - unknown_category
        - immutable_field
        - mutation_id_reused
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
            example:
              changes:
                - entity: category
                  id: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                  updatedAt: '2026-10-06T13:00:00.000Z'
                  clientMutationId: 0192f400-0000-7f1e-9b2d-00000000000a
                  fields:
                    name: Coffee
                    color: '#f59e0b'
                - entity: expense
                  id: 0192f3b1-0000-7f1e-9b2d-000000000003
                  updatedAt: '2026-10-06T13:05:00.000Z'
                  clientMutationId: 0192f400-0000-7f1e-9b2d-00000000000b
                  fields:
                    categoryId: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                    amountMinor: 450
                    date: '2026-10-06'
                    note: Flat white
      responses:
        '200':
          description: |
            The batch was processed. Inspect each result's `status`; a `200` says nothing
            about whether an individual record was applied.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
              examples:
                applied:
                  summary: Both items applied
                  value:
                    results:
                      - entity: category
                        clientMutationId: 0192f400-0000-7f1e-9b2d-00000000000a
                        id: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                        status: applied
                        idempotentReplay: false
                        error: null
                        record:
                          id: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                          name: Coffee
                          color: '#f59e0b'
                          isDefault: false
                          createdAt: '2026-10-06T13:00:00.000Z'
                          updatedAt: '2026-10-06T13:00:00.000Z'
                          deletedAt: null
                          revision: 46
                      - entity: expense
                        clientMutationId: 0192f400-0000-7f1e-9b2d-00000000000b
                        id: 0192f3b1-0000-7f1e-9b2d-000000000003
                        status: applied
                        idempotentReplay: false
                        error: null
                        record:
                          id: 0192f3b1-0000-7f1e-9b2d-000000000003
                          categoryId: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                          amountMinor: 450
                          currency: USD
                          date: '2026-10-06'
                          note: Flat white
                          createdAt: '2026-10-06T13:05:00.000Z'
                          updatedAt: '2026-10-06T13:05:00.000Z'
                          deletedAt: null
                          revision: 47
                    serverRevision: 47
                    serverTime: '2026-10-06T13:05:01.000Z'
                conflict:
                  summary: Server row was newer — write dropped, authoritative row returned
                  value:
                    results:
                      - entity: expense
                        clientMutationId: 0192f400-0000-7f1e-9b2d-00000000000c
                        id: 0192f3b1-0000-7f1e-9b2d-000000000003
                        status: conflict_server_wins
                        idempotentReplay: false
                        error: null
                        record:
                          id: 0192f3b1-0000-7f1e-9b2d-000000000003
                          categoryId: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                          amountMinor: 900
                          currency: USD
                          date: '2026-10-06'
                          note: Flat white, large
                          createdAt: '2026-10-06T13:05:00.000Z'
                          updatedAt: '2026-10-06T14:30:00.000Z'
                          deletedAt: null
                          revision: 51
                    serverRevision: 51
                    serverTime: '2026-10-06T14:31:00.000Z'
                invalid:
                  summary: Unknown `categoryId` — skipped, rest of the batch unaffected
                  value:
                    results:
                      - entity: expense
                        clientMutationId: 0192f400-0000-7f1e-9b2d-00000000000d
                        id: 0192f3b1-0000-7f1e-9b2d-000000000004
                        status: invalid
                        idempotentReplay: false
                        error:
                          code: unknown_category
                          message: No live category with that id for this user.
                          details:
                            issues:
                              - path: fields.categoryId
                                message: unknown category
                        record: null
                    serverRevision: 51
                    serverTime: '2026-10-06T14:32:00.000Z'
                idempotentReplay:
                  summary: Retry of an already-processed mutation — original result replayed
                  value:
                    results:
                      - entity: category
                        clientMutationId: 0192f400-0000-7f1e-9b2d-00000000000a
                        id: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                        status: applied
                        idempotentReplay: true
                        error: null
                        record:
                          id: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                          name: Coffee
                          color: '#f59e0b'
                          isDefault: false
                          createdAt: '2026-10-06T13:00:00.000Z'
                          updatedAt: '2026-10-06T13:00:00.000Z'
                          deletedAt: null
                          revision: 46
                    serverRevision: 51
                    serverTime: '2026-10-06T14:33:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: |
            The batch exceeded 500 items, or the body exceeded the server's size limit.
            Code: `batch_too_large`. Split the batch and send the parts sequentially,
            categories first.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: batch_too_large
                  message: A sync batch may contain at most 500 changes.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token from signup, login or refresh, sent as
        `Authorization: Bearer <accessToken>`.

        Lifetime is 1 hour. On `401 token_expired`, call `POST /v1/auth/refresh` with the
        refresh token and retry once; on `401 token_invalid`, clear credentials and send
        the user to login.

  headers:
    XRequestId:
      description: |
        Correlation id for this request, echoed from the client's `X-Request-Id` if it
        sent one and generated otherwise. Logged server-side; quote it in bug reports.
      required: false
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      required: false
      schema:
        type: integer
        minimum: 0

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: |
        Id of the row. A well-formed id that belongs to another user returns `404`, never
        `403`, so ids cannot be probed for existence.
      schema: { $ref: '#/components/schemas/Uuid' }
    IncludeDeleted:
      name: includeDeleted
      in: query
      required: false
      description: |
        Include tombstoned (soft-deleted) rows. Mainly for debugging and tests — the
        mobile app gets tombstones through `GET /v1/sync` instead.
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: |
        The request was rejected before any work was done. Codes: `validation_error`
        (body, query or path failed schema validation, including an unknown field —
        `details.issues` lists the offending paths), `malformed_request` (unparseable JSON
        or a missing required body), `invalid_cursor` (an opaque `cursor` could not be
        decoded).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error:
              code: validation_error
              message: Request body failed validation.
              details:
                issues:
                  - path: amountMinor
                    message: Expected integer, received number
    Unauthorized:
      description: |
        Authentication failed. Codes: `unauthorized` (no or non-Bearer `Authorization`
        header), `token_expired` (well-formed but past expiry — refresh and retry once),
        `token_invalid` (bad signature or shape — clear credentials and re-login).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error:
              code: token_expired
              message: Access token has expired.
    # There is deliberately no `Forbidden` (403) response component. The `forbidden`
    # error code is reserved in the enum, but no MVP endpoint returns it: cross-tenant
    # row access is reported as `404 not_found` so that ids cannot be probed.
    NotFound:
      description: |
        No such route, or no such row **for this user**. Code: `not_found`. A row owned by
        another user is reported here rather than as `403`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error:
              code: not_found
              message: No such expense.
    UnsupportedMediaType:
      description: |
        A request with a body did not have `Content-Type: application/json`.
        Code: `unsupported_media_type`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error:
              code: unsupported_media_type
              message: Content-Type must be application/json.
    UnprocessableEntity:
      description: |
        The body was well-formed and schema-valid but could not be acted on. Codes:
        `unknown_category` (`categoryId` does not name a live category of this user),
        `immutable_field` (the request tried to set a server-owned field — `id` on a
        PATCH, `userId`, `createdAt` or `revision`).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error:
              code: unknown_category
              message: No live category with that id for this user.
    RateLimited:
      description: 'Too many requests. Code: `rate_limited`. Honour `Retry-After`.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error:
              code: rate_limited
              message: Too many requests. Retry later.
    InternalError:
      description: |
        Unexpected server fault. Code: `internal_error`. The message never leaks
        internals — correlate via `X-Request-Id` in the server logs. Safe to retry with
        backoff; sync pushes are idempotent on `clientMutationId`, so a retry cannot
        double-apply.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error:
              code: internal_error
              message: Something went wrong.

  schemas:
    # -----------------------------------------------------------------------
    # Primitives. Declared once so that "what is an id", "what is money" and
    # "what is a date" are answered in exactly one place.
    # Mirrors shared/src/primitives.ts.
    # -----------------------------------------------------------------------
    Uuid:
      type: string
      format: uuid
      description: |
        A UUID. Clients mint **UUIDv7** primary keys offline and the server accepts them
        as-is, so a row's identity never changes and foreign keys written offline stay
        valid. There is no temp-id-to-real-id remapping anywhere in this API.
      examples: ['0192f3a0-7c3a-7f1e-9b2d-1c4a5e6f7a80']

    Revision:
      type: integer
      minimum: 0
      description: |
        Server-assigned, **per-user monotonic** sequence number, bumped on every write to
        the row. This is the sync watermark that `GET /v1/sync?since=` walks.

        It is **not a timestamp** and must never be compared to one, nor shown to a user.
      examples: [42]

    AmountMinor:
      type: integer
      minimum: 0
      maximum: 999999999999
      description: |
        Money, as an integer count of the currency's **minor unit** — cents for USD and
        EUR, whole yen for JPY. `1234` with `currency: "USD"` is $12.34.

        Never a float and never a decimal string, on the wire or at rest: binary floats
        cannot represent `0.10` exactly, so summing them drifts, and monthly totals are
        the one number in this app a user will check against their bank.
      examples: [1234]

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: |
        ISO 4217 alphabetic currency code, uppercase. One currency per user in the MVP,
        captured at signup; there is no conversion.
      examples: ['USD']

    CalendarDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: |
        A calendar date, `YYYY-MM-DD`, with **no time and no zone**: the day the user
        assigned to the expense. Backed by a Postgres `DATE`.

        Deliberately a different type from `Timestamp`. An expense dated "5 October" is
        that day everywhere — storing it as an instant would shift it across a timezone
        change or a flight, and silently move spend between months. Monthly totals bucket
        on this field, never on `createdAt`.
      examples: ['2026-10-05']

    Timestamp:
      type: string
      format: date-time
      description: |
        An instant, RFC 3339 with an explicit UTC offset. Backed by a Postgres
        `timestamptz`. Used for `createdAt`, `updatedAt` and `deletedAt`.

        Deliberately a different type from `CalendarDate` — see that schema for why.
      examples: ['2026-10-06T12:34:56.789Z']

    OpaqueCursor:
      type: string
      minLength: 1
      maxLength: 512
      description: |
        Opaque keyset pagination cursor for `GET /v1/expenses`. Pass it back verbatim; do
        not parse, construct or store assumptions about it. Unrelated to the sync `since`
        revision watermark.
      examples: ['eyJkIjoiMjAyNi0xMC0wNSIsImkiOiIwMTkyZjNiMSJ9']

    # -----------------------------------------------------------------------
    # The error envelope. Mirrors shared/src/errors.ts.
    # -----------------------------------------------------------------------
    ErrorCode:
      type: string
      description: |
        Stable, machine-readable error code. **Branch on this, never on `message`.** The
        list is exhaustive; adding a value is a contract change. The HTTP status each code
        is returned with is noted below.

        | code | status | meaning |
        |---|---|---|
        | `validation_error` | 400 | Body, query or path failed schema validation, including an unknown field. `details.issues` lists the offending paths. |
        | `malformed_request` | 400 | Body was not parseable JSON, or a required body was absent. |
        | `invalid_cursor` | 400 | An opaque pagination `cursor` could not be decoded (truncated, tampered, or from an older server). |
        | `unsupported_media_type` | 415 | `Content-Type` was not `application/json` on a request with a body. |
        | `unauthorized` | 401 | No credentials presented (missing or non-Bearer `Authorization` header). |
        | `invalid_credentials` | 401 | Email/password pair did not match. Does not say which half was wrong. |
        | `token_expired` | 401 | Token is well-formed but past its expiry. Refresh and retry once. |
        | `token_invalid` | 401 | Token signature/shape is bad, or the refresh token is unknown, revoked or already rotated. Re-login. |
        | `forbidden` | 403 | Authenticated but not permitted. Cross-tenant row access is `not_found`, not this. |
        | `not_found` | 404 | No such route, or no such row for this user. Cross-tenant reads are 404, not 403, so ids cannot be probed. |
        | `email_already_exists` | 409 | Signup with an email that already has an account. |
        | `category_name_taken` | 409 | Another live category of this user already has that name (case-insensitive). |
        | `category_not_deletable` | 409 | Attempt to delete the default `Uncategorized` category, which must always exist. |
        | `unknown_category` | 422 | `categoryId` does not name a live category of this user. Appears as a per-record `invalid` on sync. |
        | `immutable_field` | 422 | The request tried to set a server-owned field (`id`, `userId`, `createdAt`, `revision`). Also a per-record `invalid` on sync. |
        | `mutation_id_reused` | 409 | A `clientMutationId` was reused with a different payload. Also a per-record `invalid` on sync. |
        | `batch_too_large` | 413 | A `POST /v1/sync` batch exceeded 500 items, or the body exceeded the server limit. |
        | `rate_limited` | 429 | Too many requests. `Retry-After` is set. |
        | `internal_error` | 500 | Unexpected server fault. Never leaks internals; correlate via `X-Request-Id`. |
      enum:
        - validation_error
        - malformed_request
        - invalid_cursor
        - unsupported_media_type
        - unauthorized
        - invalid_credentials
        - token_expired
        - token_invalid
        - forbidden
        - not_found
        - email_already_exists
        - category_name_taken
        - category_not_deletable
        - unknown_category
        - immutable_field
        - mutation_id_reused
        - batch_too_large
        - rate_limited
        - internal_error

    ErrorDetails:
      type: object
      description: |
        Optional structured detail. The shape depends on `code`; always treat it as
        best-effort and never require it. Open to additional keys.
      additionalProperties: true
      properties:
        issues:
          type: array
          description: Field-level issues. Present for `validation_error`.
          items:
            type: object
            additionalProperties: true
            required: [path, message]
            properties:
              path:
                type: string
                description: Dotted path to the offending field, e.g. `fields.amountMinor`.
              message:
                type: string
                description: What was wrong with it.

    ApiErrorBody:
      type: object
      description: The inner object of the error envelope. Also used per-record on sync push.
      additionalProperties: false
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: |
            Human-readable explanation, for developers and logs. **Not for parsing and not
            for display to end users** — it may change without a version bump.
        details: { $ref: '#/components/schemas/ErrorDetails' }

    ApiError:
      type: object
      title: Error envelope
      description: |
        The body of **every** non-2xx response in this API. One shape everywhere, so a
        client needs one error path rather than one per endpoint.
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ApiErrorBody' }

    # -----------------------------------------------------------------------
    # Health. Mirrors shared/src/health.ts.
    # -----------------------------------------------------------------------
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, time, db]
      properties:
        status:
          const: ok
          description: Always `ok` — a failing instance does not return a 200 at all.
        version:
          type: string
          description: Deployed backend version (package version or git sha).
        time:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: Server clock, so a client can sanity-check its own against it.
        db:
          const: up
          description: Present only when the Postgres connectivity check passed.

    # -----------------------------------------------------------------------
    # User and auth. Mirrors shared/src/user.ts and shared/src/auth.ts.
    # -----------------------------------------------------------------------
    Email:
      type: string
      format: email
      maxLength: 254
      description: |
        Email address. Normalised server-side (trimmed and lowercased) before storage and
        comparison, so `A@x.com` and `a@x.com` are the same account.
      examples: ['sam@example.com']

    Password:
      type: string
      minLength: 8
      maxLength: 128
      format: password
      writeOnly: true
      description: |
        Plaintext password, 8–128 characters. Sent only over TLS, hashed with argon2id
        server-side, and never stored, logged or returned.

    AccessToken:
      type: string
      description: |
        Short-lived JWT (1 hour). Send as `Authorization: Bearer <accessToken>` on every
        endpoint except `/v1/health` and `/v1/auth/*`. Treat it as opaque — the client
        must not read claims out of it to decide anything.

    RefreshToken:
      type: string
      minLength: 1
      maxLength: 512
      description: |
        Opaque refresh token (60 days). **Single use**: a successful refresh revokes it and
        issues a new one, so replaying a rotated token returns `token_invalid`.

        The long lifetime is deliberate — an offline-first app must not log the user out
        because they were offline for a week. It is stored server-side as a hash so it can
        be revoked. Keep it in `expo-secure-store`, never in plain storage.

    User:
      type: object
      description: |
        The authenticated user as returned on the wire.

        Note there is no `userId` field in any request body or query parameter in this API:
        tenancy comes from the access token, so no endpoint can be pointed at another
        user's data.
      additionalProperties: false
      required: [id, email, currency, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { $ref: '#/components/schemas/Email' }
        currency:
          allOf: [{ $ref: '#/components/schemas/CurrencyCode' }]
          description: |
            The user's single currency, captured at signup and not changeable in the MVP.
            Every expense of this user uses it.
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    MeResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }

    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        currency:
          allOf: [{ $ref: '#/components/schemas/CurrencyCode' }]
          default: USD
          description: |
            Currency for this account, captured once at signup. Defaults to `USD` when
            omitted. Not changeable in the MVP.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { $ref: '#/components/schemas/RefreshToken' }

    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { $ref: '#/components/schemas/RefreshToken' }

    TokenPair:
      type: object
      description: A freshly issued access + refresh pair. Store both; they rotate together.
      additionalProperties: false
      required: [accessToken, refreshToken, accessTokenExpiresIn, refreshTokenExpiresAt]
      properties:
        accessToken: { $ref: '#/components/schemas/AccessToken' }
        refreshToken: { $ref: '#/components/schemas/RefreshToken' }
        accessTokenExpiresIn:
          type: integer
          minimum: 1
          description: |
            Lifetime of `accessToken` in seconds from now (`3600` = 1 hour). A duration
            rather than an instant, so a client with a skewed clock can still schedule its
            refresh correctly.
          examples: [3600]
        refreshTokenExpiresAt:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: |
            Absolute expiry of `refreshToken`, 60 days out. After this the user must log in
            again.

    RefreshResponse:
      allOf: [{ $ref: '#/components/schemas/TokenPair' }]
      description: |
        A rotated pair. The refresh token presented in the request is now revoked —
        overwrite it, do not keep it as a fallback.

    AuthResponse:
      type: object
      description: |
        Response to signup and login: the new session plus the user it belongs to. The
        token fields are identical to `TokenPair`, flattened alongside `user`.
      additionalProperties: false
      required: [user, accessToken, refreshToken, accessTokenExpiresIn, refreshTokenExpiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { $ref: '#/components/schemas/AccessToken' }
        refreshToken: { $ref: '#/components/schemas/RefreshToken' }
        accessTokenExpiresIn:
          type: integer
          minimum: 1
          description: Lifetime of `accessToken` in seconds from now (`3600` = 1 hour).
          examples: [3600]
        refreshTokenExpiresAt:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: Absolute expiry of `refreshToken`, 60 days out.

    # -----------------------------------------------------------------------
    # Syncable row metadata, carried by every category and expense.
    # Mirrors shared/src/syncable.ts.
    # -----------------------------------------------------------------------
    CreatedAt:
      allOf: [{ $ref: '#/components/schemas/Timestamp' }]
      readOnly: true
      description: When the server first stored the row. Server-owned and immutable.

    UpdatedAt:
      allOf: [{ $ref: '#/components/schemas/Timestamp' }]
      description: |
        The client's edit time, clamped server-side to `now + 5 minutes`. **This is the
        field last-write-wins orders on.** See `POST /v1/sync` for why it is the client's
        clock and why it is clamped.

    DeletedAt:
      oneOf:
        - { $ref: '#/components/schemas/Timestamp' }
        - type: 'null'
      description: |
        Tombstone marker. Non-null means the row is deleted and the client must hide it.

        Deletes are soft everywhere, because a sync protocol cannot propagate a hard
        delete — an absent row is indistinguishable from one the client has never seen.
        Tombstones are pruned 90 days after deletion; see `GET /v1/sync` for what that
        implies for a long-dormant client.

    # -----------------------------------------------------------------------
    # Categories. Mirrors shared/src/category.ts.
    # -----------------------------------------------------------------------
    CategoryName:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Display name, 1–64 characters after trimming (the server trims). Unique per user
        among live (non-deleted) categories, compared case-insensitively.
      examples: ['Groceries']

    CategoryColor:
      type: string
      pattern: '^#[0-9a-fA-F]{6}$'
      description: |
        Chart and list swatch, as a `#RRGGBB` hex colour. The server assigns one when
        omitted, so the client never has to invent a default.
      examples: ['#22c55e']

    Category:
      type: object
      description: |
        A category row as the server reports it.

        Categories are user-owned and a default set is seeded at signup. Deleting one
        **reassigns** its expenses to the user's `Uncategorized` default rather than
        cascading — losing spend history to a category cleanup would be a data-loss bug.
      additionalProperties: false
      required: [id, name, color, isDefault, createdAt, updatedAt, deletedAt, revision]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/CategoryName' }
        color: { $ref: '#/components/schemas/CategoryColor' }
        isDefault:
          type: boolean
          description: |
            True for the seeded `Uncategorized` category, which always exists and cannot be
            deleted. Deleting any other category reassigns its expenses here.
        createdAt: { $ref: '#/components/schemas/CreatedAt' }
        updatedAt: { $ref: '#/components/schemas/UpdatedAt' }
        deletedAt: { $ref: '#/components/schemas/DeletedAt' }
        revision: { $ref: '#/components/schemas/Revision' }

    CategoryCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            Optional client-minted UUIDv7. Supply it so a row created offline keeps its
            identity; omit it and the server mints one.
        name: { $ref: '#/components/schemas/CategoryName' }
        color: { $ref: '#/components/schemas/CategoryColor' }

    CategoryUpdateRequest:
      type: object
      description: |
        Partial update. At least one property must be present; an empty object is
        `400 validation_error`.
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/CategoryName' }
        color: { $ref: '#/components/schemas/CategoryColor' }

    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          description: All live categories of the user, ordered by `name`. Not paginated.
          items: { $ref: '#/components/schemas/Category' }

    CategoryResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Category' }

    # -----------------------------------------------------------------------
    # Expenses. Mirrors shared/src/expense.ts.
    # -----------------------------------------------------------------------
    ExpenseNote:
      type: string
      maxLength: 500
      description: Free-text note, up to 500 characters after trimming (the server trims).
      examples: ['Weekly shop']

    Expense:
      type: object
      description: |
        An expense row as the server reports it.

        Money is `amountMinor` + `currency`; the day it happened is the zone-less calendar
        `date`. Monthly totals bucket on `date`, never on `createdAt`.
      additionalProperties: false
      required:
        - id
        - categoryId
        - amountMinor
        - currency
        - date
        - note
        - createdAt
        - updatedAt
        - deletedAt
        - revision
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        categoryId:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            Owning category. Always a live category of the same user; reassigned to the
            `Uncategorized` default if its category is deleted.
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        date:
          allOf: [{ $ref: '#/components/schemas/CalendarDate' }]
          description: |
            The day the user assigned to the expense, as a zone-less calendar date. Distinct
            from `createdAt`/`updatedAt`, which are instants.
        note:
          oneOf:
            - { $ref: '#/components/schemas/ExpenseNote' }
            - type: 'null'
          description: Free-text note, or `null` when the user did not write one.
        createdAt: { $ref: '#/components/schemas/CreatedAt' }
        updatedAt: { $ref: '#/components/schemas/UpdatedAt' }
        deletedAt: { $ref: '#/components/schemas/DeletedAt' }
        revision: { $ref: '#/components/schemas/Revision' }

    ExpenseCreateRequest:
      type: object
      additionalProperties: false
      required: [categoryId, amountMinor, date]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            Optional client-minted UUIDv7. Supply it so a row created offline keeps its
            identity; omit it and the server mints one.
        categoryId:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            Must name a live category of this user, otherwise `422 unknown_category`.
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        currency:
          allOf: [{ $ref: '#/components/schemas/CurrencyCode' }]
          description: |
            Defaults to the user's currency when omitted. In the MVP it must equal it —
            there is no conversion, so anything else is a `validation_error`.
        date: { $ref: '#/components/schemas/CalendarDate' }
        note:
          oneOf:
            - { $ref: '#/components/schemas/ExpenseNote' }
            - type: 'null'

    ExpenseUpdateRequest:
      type: object
      description: |
        Partial update. At least one property must be present; an empty object is
        `400 validation_error`. Send `note: null` to clear the note.
      additionalProperties: false
      minProperties: 1
      properties:
        categoryId: { $ref: '#/components/schemas/Uuid' }
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        date: { $ref: '#/components/schemas/CalendarDate' }
        note:
          oneOf:
            - { $ref: '#/components/schemas/ExpenseNote' }
            - type: 'null'

    ExpenseListResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor, hasMore]
      properties:
        data:
          type: array
          description: |
            A page of expenses, newest `date` first with ties broken by `id` descending.
          items: { $ref: '#/components/schemas/Expense' }
        nextCursor:
          oneOf:
            - { $ref: '#/components/schemas/OpaqueCursor' }
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.
        hasMore:
          type: boolean
          description: True when another page exists. Equivalent to `nextCursor !== null`.

    ExpenseResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Expense' }

    # -----------------------------------------------------------------------
    # Sync. Mirrors shared/src/sync.ts. The operation descriptions on
    # /v1/sync carry the protocol rules in full.
    # -----------------------------------------------------------------------
    # Each discriminated union below is built from **named** branch schemas rather than
    # inline ones. A `discriminator` cannot select an inline subschema, and client
    # generators emit an untagged union (or nothing) when it tries to.

    CategorySyncChange:
      type: object
      title: Category change
      description: A changed category row, as delivered by `GET /v1/sync`.
      additionalProperties: false
      required: [entity, record]
      properties:
        entity: { const: category }
        record: { $ref: '#/components/schemas/Category' }

    ExpenseSyncChange:
      type: object
      title: Expense change
      description: A changed expense row, as delivered by `GET /v1/sync`.
      additionalProperties: false
      required: [entity, record]
      properties:
        entity: { const: expense }
        record: { $ref: '#/components/schemas/Expense' }

    SyncChange:
      description: |
        One changed row, discriminated on `entity` so a client gets a precise type for
        `record` without a cast. Deleted rows arrive with `deletedAt` set; that tombstone
        is the only way a delete crosses the wire.

        `entity` also fixes the order the server applies a batch in: all `category` items,
        then all `expense` items — so an expense created offline against a category created
        offline syncs in one round trip.
      oneOf:
        - { $ref: '#/components/schemas/CategorySyncChange' }
        - { $ref: '#/components/schemas/ExpenseSyncChange' }
      discriminator:
        propertyName: entity
        mapping:
          category: '#/components/schemas/CategorySyncChange'
          expense: '#/components/schemas/ExpenseSyncChange'

    SyncPullResponse:
      type: object
      description: |
        The result of a pull. **Check `resyncRequired` first** — when it is true there are
        no changes to apply and the client must start over from `since=0`.
      additionalProperties: false
      required: [changes, nextCursor, hasMore, resyncRequired, serverTime]
      properties:
        changes:
          type: array
          description: |
            Rows with `revision > since`, ordered by `revision` ascending, including
            tombstones. Empty when the client is up to date or when `resyncRequired` is
            true.
          items: { $ref: '#/components/schemas/SyncChange' }
        nextCursor:
          allOf: [{ $ref: '#/components/schemas/Revision' }]
          description: |
            The watermark to send as `since` next time: the highest `revision` in
            `changes`, or the `since` you sent when `changes` is empty.

            **Persist it only after the whole page is committed locally.** Storing it first
            and then crashing mid-write means those rows are never sent again.
        hasMore:
          type: boolean
          description: |
            True when more changes exist past `nextCursor`. Keep calling with the new
            `since` until it is false.
        resyncRequired:
          type: boolean
          description: |
            True when `since` predates the 90-day tombstone horizon (or exceeds the user's
            current revision), so an incremental answer could resurrect deleted rows.

            The client must wipe local server-derived state and pull again from `since=0`.
            Push any unacknowledged local changes **before** wiping, or they are lost. When
            true, `changes` is empty, `nextCursor` is `0` and `hasMore` is false.
        serverTime:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: |
            Server clock at response time. Clients may use it to estimate their own skew.
            It is never a sync cursor — `nextCursor` is.

    CategorySyncFields:
      type: object
      description: |
        Mutable category fields in a push. All optional, because a push is an **upsert with
        a merge**: on an existing row absent keys are left alone, and on a row the server
        has never seen `fields` must be complete enough to create it (`name` required) or
        the result is `invalid`.

        Set `deletedAt` to delete; set it back to `null` to undelete.
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/CategoryName' }
        color: { $ref: '#/components/schemas/CategoryColor' }
        deletedAt: { $ref: '#/components/schemas/DeletedAt' }

    ExpenseSyncFields:
      type: object
      description: |
        Mutable expense fields in a push. Same upsert/merge semantics as
        `CategorySyncFields`. To create a row that does not exist yet, `categoryId`,
        `amountMinor` and `date` are all required.

        Set `deletedAt` to delete; set it back to `null` to undelete.
      additionalProperties: false
      minProperties: 1
      properties:
        categoryId: { $ref: '#/components/schemas/Uuid' }
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        date: { $ref: '#/components/schemas/CalendarDate' }
        note:
          oneOf:
            - { $ref: '#/components/schemas/ExpenseNote' }
            - type: 'null'
        deletedAt: { $ref: '#/components/schemas/DeletedAt' }

    ClientMutationId:
      allOf: [{ $ref: '#/components/schemas/Uuid' }]
      description: |
        Idempotency key: a UUID minted once per local mutation and **reused across
        retries**, unique per user.

        A push retried after a dropped response is a no-op that replays the original result
        with `idempotentReplay: true`. Without this a flaky-network retry double-applies,
        which is the most common offline-sync bug. Reusing an id with a *different* payload
        is `invalid` with code `mutation_id_reused`.

    SyncPushUpdatedAt:
      allOf: [{ $ref: '#/components/schemas/Timestamp' }]
      description: |
        When the user made the edit, per the **client** clock — the client is the only
        party that knows when the user actually made it.

        Last-write-wins orders on this. The server clamps it to `now + 5 minutes` before
        comparing and storing, so a device with a badly-set clock cannot write a far-future
        `updatedAt` and permanently win every later conflict on that row, leaving it
        unfixable from any other device. A clamped item can therefore come back
        `conflict_server_wins` even though its raw value looked newer.

    SyncPushItemId:
      allOf: [{ $ref: '#/components/schemas/Uuid' }]
      description: |
        Client-minted UUIDv7 primary key of the row. Creates and updates are the same
        call: the server upserts on this id.

    CategorySyncPushItem:
      type: object
      title: Category push item
      description: An upsert of one category row.
      additionalProperties: false
      required: [entity, id, updatedAt, clientMutationId, fields]
      properties:
        entity: { const: category }
        id: { $ref: '#/components/schemas/SyncPushItemId' }
        updatedAt: { $ref: '#/components/schemas/SyncPushUpdatedAt' }
        clientMutationId: { $ref: '#/components/schemas/ClientMutationId' }
        fields: { $ref: '#/components/schemas/CategorySyncFields' }

    ExpenseSyncPushItem:
      type: object
      title: Expense push item
      description: An upsert of one expense row.
      additionalProperties: false
      required: [entity, id, updatedAt, clientMutationId, fields]
      properties:
        entity: { const: expense }
        id: { $ref: '#/components/schemas/SyncPushItemId' }
        updatedAt: { $ref: '#/components/schemas/SyncPushUpdatedAt' }
        clientMutationId: { $ref: '#/components/schemas/ClientMutationId' }
        fields: { $ref: '#/components/schemas/ExpenseSyncFields' }

    SyncPushItem:
      description: |
        One item in a push batch, discriminated on `entity` so `fields` is precisely typed.
        Creates and updates are the same call — the server upserts on `id`.
      oneOf:
        - { $ref: '#/components/schemas/CategorySyncPushItem' }
        - { $ref: '#/components/schemas/ExpenseSyncPushItem' }
      discriminator:
        propertyName: entity
        mapping:
          category: '#/components/schemas/CategorySyncPushItem'
          expense: '#/components/schemas/ExpenseSyncPushItem'

    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            The batch, 1–500 items. Push categories before the expenses that reference
            them; the server also sorts by entity internally, so one round trip is enough.
            Over 500 items is `413 batch_too_large`.
          items: { $ref: '#/components/schemas/SyncPushItem' }

    SyncPushStatus:
      type: string
      enum: [applied, conflict_server_wins, invalid]
      description: |
        Per-record outcome, so one bad row cannot fail the batch.

        - `applied` — the incoming `updatedAt` was strictly newer than stored, and the
          write landed.
        - `conflict_server_wins` — the stored `updatedAt` was newer than or equal to the
          incoming one, so the write was dropped. Ties go to the server, which keeps the
          outcome deterministic.
        - `invalid` — validation or referential failure (unknown `categoryId`, an
          incomplete create, a reused `clientMutationId`). `error` says which.

    SyncPushEchoedMutationId:
      allOf: [{ $ref: '#/components/schemas/Uuid' }]
      description: |
        Echoed verbatim from the request item, so results can be matched back to local
        mutations. Match on this rather than on array position.

    SyncPushIdempotentReplay:
      type: boolean
      description: |
        True when this result was replayed from an already-processed `clientMutationId`
        rather than applied now. The outcome is identical either way — this is for
        diagnostics, not for branching.

    SyncPushError:
      oneOf:
        - { $ref: '#/components/schemas/ApiErrorBody' }
        - type: 'null'
      description: |
        Non-null only when `status` is `invalid`; explains why the record was rejected.
        Typical codes here are `validation_error`, `unknown_category`, `immutable_field`
        and `mutation_id_reused`.

    CategorySyncPushResult:
      type: object
      title: Category push result
      description: The outcome of one category upsert, plus the authoritative server row.
      additionalProperties: false
      required: [entity, clientMutationId, id, status, idempotentReplay, error, record]
      properties:
        entity: { const: category }
        clientMutationId: { $ref: '#/components/schemas/SyncPushEchoedMutationId' }
        id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/SyncPushStatus' }
        idempotentReplay: { $ref: '#/components/schemas/SyncPushIdempotentReplay' }
        error: { $ref: '#/components/schemas/SyncPushError' }
        record:
          oneOf:
            - { $ref: '#/components/schemas/Category' }
            - type: 'null'
          description: |
            The authoritative server row after the batch — present for `applied` and
            `conflict_server_wins` alike. `null` only for an `invalid` item whose row does
            not exist server-side.

    ExpenseSyncPushResult:
      type: object
      title: Expense push result
      description: The outcome of one expense upsert, plus the authoritative server row.
      additionalProperties: false
      required: [entity, clientMutationId, id, status, idempotentReplay, error, record]
      properties:
        entity: { const: expense }
        clientMutationId: { $ref: '#/components/schemas/SyncPushEchoedMutationId' }
        id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/SyncPushStatus' }
        idempotentReplay: { $ref: '#/components/schemas/SyncPushIdempotentReplay' }
        error: { $ref: '#/components/schemas/SyncPushError' }
        record:
          oneOf:
            - { $ref: '#/components/schemas/Expense' }
            - type: 'null'
          description: |
            The authoritative server row after the batch — present for `applied` and
            `conflict_server_wins` alike. `null` only for an `invalid` item whose row does
            not exist server-side.

    SyncPushResult:
      description: |
        One push result, discriminated on `entity`.

        `record` is the **authoritative server row** after the batch, present for
        `applied` and `conflict_server_wins` alike. The client overwrites its local copy
        with it; converging on server state is what stops two devices drifting apart. A
        conflict response that only said "no" would leave the loser holding data the server
        will never have.
      oneOf:
        - { $ref: '#/components/schemas/CategorySyncPushResult' }
        - { $ref: '#/components/schemas/ExpenseSyncPushResult' }
      discriminator:
        propertyName: entity
        mapping:
          category: '#/components/schemas/CategorySyncPushResult'
          expense: '#/components/schemas/ExpenseSyncPushResult'

    SyncPushResponse:
      type: object
      additionalProperties: false
      required: [results, serverRevision, serverTime]
      properties:
        results:
          type: array
          description: One result per request item, in the order the items were sent.
          items: { $ref: '#/components/schemas/SyncPushResult' }
        serverRevision:
          allOf: [{ $ref: '#/components/schemas/Revision' }]
          description: |
            The highest `revision` for this user after the batch.

            **Do not use it as the next `since`.** The batch bumped revisions for your own
            writes, so pulling from here would skip changes another device made meanwhile.
            Keep using the `nextCursor` from `GET /v1/sync`.
        serverTime:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: Server clock at response time.
