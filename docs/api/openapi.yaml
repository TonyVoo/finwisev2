  /v1/expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expenses
      description: |
        A filtered page of the user's expenses, newest `date` first with ties broken by
        `id` descending.

        Pagination is **keyset** on `(date DESC, id DESC)`, not offset: pass the previous
        page's `nextCursor` back as `cursor`. Offset pagination would skip or repeat rows
        when a write lands between pages, which with an actively syncing client is the
        normal case, not an edge case.

        `from`/`to` are inclusive bounds on the calendar `date`, so a month is
        `from=2026-10-01&to=2026-10-31`. They never filter on `createdAt`.

        Note the mobile app does **not** use this endpoint for its list or its monthly
        totals; it reads local SQLite, which is what makes those work offline. This exists
        for a thin/online client and for tests.
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on the expense's calendar `date`.
          schema: { $ref: '#/components/schemas/CalendarDate' }
          example: '2026-10-01'
        - name: to
          in: query
          required: false
          description: |
            Inclusive upper bound on the expense's calendar `date`. Must not be earlier
            than `from`; if it is, the result is `400 validation_error`.
          schema: { $ref: '#/components/schemas/CalendarDate' }
          example: '2026-10-31'
        - name: categoryId
          in: query
          required: false
          description: |
            Restrict to one category. An unknown id is not an error — it simply matches
            nothing and returns an empty page.
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: |
            Opaque cursor from the previous page's `nextCursor`. Pass it back verbatim; do
            not parse or construct one. An undecodable value is `400 invalid_cursor`.
            Unrelated to the sync `since` revision watermark.
          schema: { $ref: '#/components/schemas/OpaqueCursor' }
        - $ref: '#/components/parameters/IncludeDeleted'
      x-errorCodes:
        - validation_error
        - invalid_cursor
        - unauthorized
        - token_expired
        - token_invalid
        - rate_limited
        - internal_error
      responses:
        '200':
          description: A page of expenses.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseListResponse' }
              example:
                data:
                  - id: 0192f3b1-0000-7f1e-9b2d-000000000001
                    categoryId: 0192f3a0-7c3a-7f1e-9b2d-000000000001
                    amountMinor: 1234
                    currency: USD
                    date: '2026-10-05'
                    note: Weekly shop
                    createdAt: '2026-10-05T18:02:11.000Z'
                    updatedAt: '2026-10-05T18:02:11.000Z'
                    deletedAt: null
                    revision: 4
                nextCursor: eyJkIjoiMjAyNi0xMC0wNSIsImkiOiIwMTkyZjNiMSJ9
                hasMore: true
        '400':
          description: |
            Codes: `validation_error` (a bad or out-of-range parameter, an unknown
            parameter, or `to` before `from`) or `invalid_cursor` (the `cursor` could not
            be decoded).
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: invalid_cursor
                  message: The pagination cursor could not be decoded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create an expense
      description: |
        Creates an expense for the authenticated user.

        Supply `id` (a client-minted UUIDv7) so a row created offline keeps its identity;
        omit it and the server mints one. `categoryId` must name a live category of this
        user, otherwise `422 unknown_category`. "Live category of this user" excludes a
        tombstoned one and another user's, and all three failures report the same
        `unknown_category` so the field cannot be used to probe for ids. `currency`
        defaults to the user's currency; in the MVP it must equal it, since there is no
        conversion — any other code is `400 validation_error`.

        Re-posting the same `id` is **idempotent**, with the same rules as
        `POST /v1/categories`: `201` with the stored row, the retried body's fields
        ignored, no new `revision`, and an id owned by another account rejected as
