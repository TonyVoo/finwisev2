# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/schemas/v3.1/schema.json
openapi: 3.1.0

info:
  title: Expense Tracker API
  version: 0.1.0
  summary: Offline-first personal expense tracking.
  description: |
    REST API for the Expense Tracker MVP (see `docs/PLAN.md` for scope and architecture).

    ## Source of truth

    This document is the source of truth for the HTTP surface: paths, statuses, headers
    and the error `code` each operation can return. The request and response **bodies**
    are declared once as zod schemas in the `@expense-tracker/shared` package
    (`shared/src/`); the backend validates with them and the mobile client infers its
    TypeScript types from them, so the two sides cannot drift. The schemas below mirror
    that package, and `shared/tests/contract.test.ts` fails the build if they disagree.

    ## Conventions

    - **Base path** is `/v1`. A breaking change ships as `/v2`; this version is additive-only.
    - **Auth** is `Authorization: Bearer <accessToken>` on every operation except
      `/v1/health` and the `/v1/auth/*` endpoints.
    - **Tenancy** comes from the access token. No request body or query parameter anywhere
      in this API accepts a `userId`, so an endpoint cannot be pointed at another user's
      data. A row belonging to another user reads as `404 not_found`, never `403`, so ids
      cannot be probed.
    - **Content type** is `application/json` for every request with a body and every
      response with a body. Anything else is `415 unsupported_media_type`.
    - **Unknown fields are rejected.** Every request body is validated closed
      (`additionalProperties: false`); an unexpected key is `400 validation_error`.
      Responses are *not* closed for the client's purposes — ignore fields you do not know.
    - **Errors** all share one envelope, `ApiError`. Branch on `error.code`
      (stable, enumerated) and never on `error.message` (human-readable, may change).
    - **Money** is `amountMinor` (an integer in the currency's minor unit) plus a 3-letter
      `currency`. Never a float, never a decimal string.
    - **`date` is a calendar date** (`YYYY-MM-DD`, no time, no zone) and is a different
      thing from the `createdAt`/`updatedAt` instants. See `CalendarDate` vs `Timestamp`.
    - **Deletes are soft.** `DELETE` sets `deletedAt` and returns the tombstoned row.
      A sync protocol cannot propagate a hard delete, since an absent row is
      indistinguishable from one the client has never seen.
    - **Ids are client-minted UUIDv7.** The client may create rows offline with its own
      primary keys and the server accepts them as-is, so a row's identity never changes
      and foreign keys written offline stay valid.
    - **Request ids**: every response carries `X-Request-Id`. Quote it in bug reports.

    ## Two write paths

    The REST CRUD endpoints exist for a thin/online client and for testability. The mobile
    app writes exclusively through `POST /v1/sync`, so it has one write path rather than
    two. Both paths produce identical rows.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  contact:
    name: Backend Dev (contract owner)

servers:
  - url: http://localhost:3000
    description: Local development.
  - url: https://api.expense-tracker.example
    description: Production (placeholder; not yet provisioned).

tags:
  - name: health
    description: Unauthenticated liveness probe.
  - name: auth
    description: |
      Email + password signup/login, and the access/refresh token pair.

      The refresh token is long-lived (60 days) on purpose: an offline-first app must not
      log the user out because they were offline for a week. It is stored server-side as a
      hash so it can be revoked, and it rotates on every refresh.
  - name: categories
    description: |
      User-owned expense categories. A set of defaults is seeded at signup, including an
      undeletable `Uncategorized`. Deleting a category **reassigns** its expenses to that
      default instead of cascading — losing spend history to a category cleanup would be a
      data-loss bug.
  - name: expenses
    description: Expense CRUD and a filtered, keyset-paginated list.
  - name: sync
    description: |
      The offline-first sync protocol: pull changes by revision watermark, push a batch of
      local changes and get a per-record result. See the operation descriptions for the
      full set of rules both sides implement against.

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: |
        Reports process liveness, the deployed version, the server clock and Postgres
        connectivity. The only operation that takes no access token.

        A non-200 means "do not route traffic here". The database check is part of
        liveness on purpose: this API is useless without Postgres, so an instance that
        cannot reach it should not report itself healthy.
      security: []
      x-errorCodes: [rate_limited, internal_error]
      responses:
        '200':
          description: Service is up and Postgres is reachable.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
              example:
                status: ok
                version: 0.1.0
                time: '2026-10-06T12:34:56.789Z'
                db: up
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            Postgres is unreachable. Body is the standard envelope with code
            `internal_error`; the instance should be taken out of rotation.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: internal_error
                  message: Database connectivity check failed.

  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account
      description: |
        Creates a user, seeds the default categories, and returns a session.

        The email is normalised (trimmed and lowercased) before storage and comparison, so
        `A@x.com` and `a@x.com` are the same account. The password is hashed with argon2id
        and is never stored or logged. `currency` is captured once here and is not
        changeable in the MVP; it defaults to `USD`.
      security: []
      x-errorCodes:
        - validation_error
        - malformed_request
        - unsupported_media_type
        - email_already_exists
        - rate_limited
        - internal_error
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
            example:
              email: sam@example.com
              password: correct-horse-battery
              currency: USD
      responses:
        '201':
          description: Account created. The returned session is immediately usable.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                user:
                  id: 0192f3a0-7c3a-7f1e-9b2d-1c4a5e6f7a80
                  email: sam@example.com
                  currency: USD
                  createdAt: '2026-10-06T12:34:56.789Z'
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMTkyZjNhMCJ9.signature
                refreshToken: v1.9f8c7b6a5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a
                accessTokenExpiresIn: 3600
                refreshTokenExpiresAt: '2026-12-05T12:34:56.789Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 'An account already exists for this email. Code: `email_already_exists`.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: email_already_exists
                  message: An account with that email already exists.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      description: |
        Exchanges email + password for a fresh access/refresh pair.

        A wrong email and a wrong password are reported identically as
        `401 invalid_credentials`, so this endpoint cannot be used to enumerate accounts.

        **Rate limited, per email and per source address.** Two buckets, both counting
        **failed** attempts only over a rolling **15-minute** window
        (`LIMITS.LOGIN_RATE_LIMIT_WINDOW_SECONDS`):

        | Bucket | Failures per window | Cleared by a success |
        | --- | --- | --- |
        | One email address | 10 (`LIMITS.LOGIN_MAX_FAILURES_PER_EMAIL`) | yes |
        | One source address, all emails | 50 (`LIMITS.LOGIN_MAX_FAILURES_PER_IP`) | no |

        Over either limit the answer is `429 rate_limited` with `Retry-After` set to the
        whole seconds remaining in the window, and the password is **not** verified — so
        being throttled is cheap for the server and tells the caller nothing about
        whether the credentials were right. A throttled email with no account behaves
        identically to one with an account, so the limiter is not an enumeration oracle
        either.

        Successful logins are never counted. That is deliberate: many unrelated users
        share one office or carrier address, and counting their successes would ration
        honest traffic without troubling an attacker, whose requests are all failures.

        A client should obey `Retry-After` rather than retrying on a schedule of its own.
      security: []
      x-errorCodes:
        - validation_error
        - malformed_request
        - unsupported_media_type
        - invalid_credentials
        - rate_limited
        - internal_error
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: sam@example.com
              password: correct-horse-battery
      responses:
        '200':
          description: Authenticated. A new session was issued.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Email/password pair did not match. Code: `invalid_credentials`. Deliberately
            does not say which half was wrong.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Rotate the token pair
      description: |
        Exchanges a valid refresh token for a new access + refresh pair.

        Refresh tokens are **single use**: a successful refresh revokes the presented token
        and issues a new one. Replaying an already-rotated token is `401 token_invalid` —
        treat that as "session over, re-login".

        Call this when the access token is expired or about to expire, not on every
        request.
      security: []
      x-errorCodes:
        - validation_error
        - malformed_request
        - unsupported_media_type
        - token_expired
        - token_invalid
        - rate_limited
        - internal_error
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example:
              refreshToken: v1.9f8c7b6a5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a
      responses:
        '200':
          description: |
            Rotated. The presented refresh token is now revoked; store the new pair and
            discard the old one.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMTkyZjNhMCJ9.signature2
                refreshToken: v1.0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b
                accessTokenExpiresIn: 3600
                refreshTokenExpiresAt: '2026-12-05T13:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Codes: `token_expired` (past its 60-day expiry) or `token_invalid` (unknown,
            revoked, already rotated, or malformed). Either way the user must log in again.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: token_invalid
                  message: Refresh token is not valid.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke a refresh token
      description: |
        Revokes the given refresh token, ending that session.

        **Idempotent and deliberately forgiving**: an unknown, already-revoked or expired
        token still returns `204`. Logout must succeed from the client's point of view so
        the app can always clear local credentials — failing it would leave the user stuck
        half-logged-out. Only a malformed body is an error.

        Access tokens are not revoked here; they are short-lived (1h) and simply expire.
      security: []
      x-errorCodes:
        - validation_error
        - malformed_request
        - unsupported_media_type
        - rate_limited
        - internal_error
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
            example:
              refreshToken: v1.9f8c7b6a5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a
      responses:
        '204':
          description: |
            The token is no longer usable. Returned whether or not it was valid to begin
            with. No body.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the authenticated user
      description: |
        Returns the user the access token belongs to. Useful as a cheap token-validity
        check on app start, and as the authoritative source of the account's `currency`.
      x-errorCodes:
        - unauthorized
        - token_expired
        - token_invalid
        - rate_limited
        - internal_error
      responses:
        '200':
          description: The authenticated user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
              example:
                user:
                  id: 0192f3a0-7c3a-7f1e-9b2d-1c4a5e6f7a80
                  email: sam@example.com
                  currency: USD
                  createdAt: '2026-10-06T12:34:56.789Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Permanently delete the account
      description: |
        Deletes the authenticated user and **everything it owns**: every expense, every
        category, every session and the sync ledger. It cannot be undone, and there is no
        grace period or tombstone - the email address is free to register again immediately.

        The caller must re-enter the account password, so a stolen access token alone cannot
        destroy an account. A wrong password is `403 forbidden` (not `401`: the session is
        fine, this action is what is refused, and a client must not treat it as a dead
        session). **Wrong answers are rate limited per account**, shared with
        `POST /v1/me/password`; see `rate_limited`.

        Access tokens are stateless and are not revoked: one issued before the delete keeps
        verifying until it expires (at most 1h), after which `GET /v1/me` answers
        `401 token_invalid`. Refresh tokens die with the account immediately.
      x-errorCodes:
        - validation_error
        - malformed_request
        - unsupported_media_type
        - unauthorized
        - token_expired
        - token_invalid
        - forbidden
        - rate_limited
        - internal_error
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
            example:
              password: correct-horse-battery
      responses:
        '204':
          description: The account and all its data are gone. No body.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password
      description: |
        Replaces the account password and **ends every other session**: all of the account's
        refresh tokens are revoked in the same transaction, and the response carries a fresh
        pair for the calling device so the user is not signed out of the app they are using.
        Overwrite the stored pair with it.

        The caller must re-enter the current password. A wrong one is `403 forbidden` (not
        `401` - the session is fine and a client must not treat it as dead). The new password
        must satisfy the usual 8-128 character rule and differ from the current one
        (`validation_error` otherwise). **Wrong answers are rate limited per account**,
        shared with `DELETE /v1/me`.

        Access tokens are stateless and are not revoked: another device keeps working with
        its access token until it expires (at most 1h) and is signed out when it next
        refreshes.
      x-errorCodes:
        - validation_error
        - malformed_request
        - unsupported_media_type
        - unauthorized
        - token_expired
        - token_invalid
        - forbidden
        - rate_limited
        - internal_error
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            example:
              currentPassword: correct-horse-battery
              newPassword: staple-battery-horse
      responses:
        '200':
          description: Password changed. A fresh session for this device.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories
      description: |
        All of the user's categories, ordered by `name`. Not paginated — the category set
        is small by design and the mobile app wants it whole.

        Tombstoned categories are omitted unless `includeDeleted=true`.
      parameters:
        - $ref: '#/components/parameters/IncludeDeleted'
      x-errorCodes:
        - validation_error
        - unauthorized
        - token_expired
        - token_invalid
        - rate_limited
        - internal_error
      responses:
        '200':
          description: The user's categories.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListResponse' }
              example:
                data:
                  - id: 0192f3a0-7c3a-7f1e-9b2d-000000000001
                    name: Groceries
                    color: '#22c55e'
                    isDefault: false
                    monthlyBudgetMinor: 40000
                    createdAt: '2026-10-06T12:34:56.789Z'
                    updatedAt: '2026-10-06T12:34:56.789Z'
                    deletedAt: null
                    revision: 2
                  - id: 0192f3a0-7c3a-7f1e-9b2d-000000000000
                    name: Uncategorized
                    color: '#9ca3af'
                    isDefault: true
                    monthlyBudgetMinor: null
                    createdAt: '2026-10-06T12:34:56.789Z'
                    updatedAt: '2026-10-06T12:34:56.789Z'
                    deletedAt: null
                    revision: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      description: |
        Creates a category for the authenticated user.

        Supply `id` (a client-minted UUIDv7) so a row created offline keeps its identity;
        omit it and the server mints one. Names are unique per user among live categories,
        compared case-insensitively. `color` is assigned by the server when omitted.

        Creating with an `id` that already exists for this user is **not** an upsert here —
        use `POST /v1/sync` for upsert semantics. It is, however, **idempotent**: the
        re-post returns `201` with the stored row exactly as it is, the fields in the
        retried body are ignored rather than applied, and no new `revision` is assigned.
        A client whose response was dropped can therefore retry safely; a client that
        wants to change a field uses `PATCH`. (Resolves the `[CONFIRM]` on `EXP-02` in
        `docs/qa/TEST_PLAN.md`, which read "not an upsert" as "it fails" — nothing in the
        enumerated error codes could have expressed that failure.)

        An `id` already in use by **another** account is `400 validation_error`: the id is
        the global primary key, so the server cannot honour the create, and it must not
        answer with a row the caller does not own. The response names no owner.
      x-errorCodes:
        - validation_error
        - malformed_request
        - unsupported_media_type
        - unauthorized
        - token_expired
        - token_invalid
        - category_name_taken
        - immutable_field
        - rate_limited
        - internal_error
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreateRequest' }
            example:
              id: 0192f3a0-7c3a-7f1e-9b2d-000000000002
              name: Coffee
              color: '#f59e0b'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
              example:
                data:
                  id: 0192f3a0-7c3a-7f1e-9b2d-000000000002
                  name: Coffee
                  color: '#f59e0b'
                  isDefault: false
                  monthlyBudgetMinor: null
                  createdAt: '2026-10-06T13:00:00.000Z'
                  updatedAt: '2026-10-06T13:00:00.000Z'
                  deletedAt: null
                  revision: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Another live category of this user already has that name (case-insensitive).
            Code: `category_name_taken`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: category_name_taken
                  message: A category named "Coffee" already exists.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      description: |
        Partial update: send only the fields you are changing, at least one of them. The
        default `Uncategorized` category can be renamed and recoloured — it just cannot be
        deleted.

        A category belonging to another user, one that does not exist, and one that has
        been tombstoned are all `404`. There is no un-delete on this path — `deletedAt` is
        absent from every update schema — so a `200` here would tell the client a deleted
        row was live again. `POST /v1/sync` is the only way a row comes back.
      x-errorCodes:
        - validation_error
        - malformed_request
        - unsupported_media_type
        - unauthorized
        - token_expired
        - token_invalid
        - not_found
        - category_name_taken
        - immutable_field
        - rate_limited
